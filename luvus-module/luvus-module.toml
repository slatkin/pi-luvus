id = "pi-luvus.pane-titles"
name = "pi pane titles"
version = "0.2.0"
min_luvus_version = "0.14.1"
description = "Publish titles for resumable pi sessions onto the AGENTS history rows."

# Repaint after a restart, on every agent status change, and when a pane
# closes (the moment a pi session becomes a resumable row).
[[startup]]
command = ["node", "titles.ts"]

[[events]]
on = "pane.agent_status_changed"
command = ["node", "titles.ts"]

[[events]]
on = "pane.closed"
command = ["node", "titles.ts"]
